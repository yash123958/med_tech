<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
    background: #eef3f5;
    font-family: 'Segoe UI', sans-serif;
}

/* Center box */
.login-box {
    width: 350px;
    margin: 100px auto;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
}

/* Title */
.login-box h2 {
    margin-bottom: 20px;
    color: #0d6efd;
}

/* Inputs */
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #ddd;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 5px rgba(13,110,253,0.3);
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: #0d6efd;
    color: white;
    border: none;
    border-radius: 10px;
    margin-top: 10px;
    cursor: pointer;
    font-weight: 500;
}

button:hover {
    background: #0b5ed7;
}

/* Error */
.error {
    color: red;
    margin-top: 10px;
}

/* Link */
.link {
    margin-top: 15px;
    display: block;
    color: #555;
}
</style>

</head>

<body>

<div class="login-box">

    <h2>💙 MediShare Login</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </form>

    <a href="/register/" class="link">Create account</a>

</div>

</body>
</html>
