<!DOCTYPE html>
<html>
<head>
<title>Track Request</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
    font-family: 'Segoe UI';
}

.track-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.step {
    text-align: center;
    flex: 1;
}

.circle {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #ccc;
    margin: auto;
    line-height: 45px;
    color: white;
    font-weight: bold;
}

.active { background: #0d6efd; }
.done { background: #28a745; }

.line {
    height: 4px;
    background: #ccc;
    flex: 1;
    margin-top: 22px;
}
</style>

</head>

<body>

<div class="container mt-5">

<div class="track-box">

<h4 class="mb-4">Track Request</h4>

<p><strong>Medicine:</strong> {{ req.donation.medicine_name }}</p>
<p><strong>Status:</strong> {{ req.status }}</p>

<div class="d-flex align-items-center mt-5">

    <!-- 1 -->
    <div class="step">
        <div class="circle {% if req.status == 'REQUESTED' %}active{% else %}done{% endif %}">1</div>
        <p>Requested</p>
    </div>

    <div class="line"></div>

    <!-- 2 -->
    <div class="step">
        <div class="circle {% if req.status == 'APPROVED' %}active{% elif req.status != 'REQUESTED' %}done{% endif %}">2</div>
        <p>Approved</p>
    </div>

    <div class="line"></div>

    <!-- 3 -->
    <div class="step">
        <div class="circle {% if req.status == 'PACKED' %}active{% elif req.status in 'SHIPPED DELIVERED' %}done{% endif %}">3</div>
        <p>Packed</p>
    </div>

    <div class="line"></div>

    <!-- 4 -->
    <div class="step">
        <div class="circle {% if req.status == 'SHIPPED' %}active{% elif req.status == 'DELIVERED' %}done{% endif %}">4</div>
        <p>Shipped</p>
    </div>

    <div class="line"></div>

    <!-- 5 -->
    <div class="step">
        <div class="circle {% if req.status == 'DELIVERED' %}active done{% endif %}">5</div>
        <p>Delivered</p>
    </div>

</div>

</div>

</div>

</body>
</html>
